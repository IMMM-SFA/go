[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "go"
description = "An An open-source grid operations model"
readme = "README.md"
version = "0.1.0"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "Kerem Akdemir", email = "kerem.akdemir@pnnl.gov"},
    {name = "Chris Vernon", email = "chris.vernon@pnnl.gov"},
    {name = "Kendall Mongird", email = "kendall.mongird@pnnl.gov"},
    {name = "Travis Thurber", email = "travis.thurber@pnnl.gov"},
]
maintainers = [
    {name = "Kerem Akdemir", email = "kerem.akdemir@pnnl.gov"},
    {name = "Chris Vernon", email = "chris.vernon@pnnl.gov"},
    {name = "Kendall Mongird", email = "kendall.mongird@pnnl.gov"},
    {name = "Travis Thurber", email = "travis.thurber@pnnl.gov"},
]
dependencies = [
    'PyYAML>=5.4.1',
    'requests>=2.25.1',
    'pyomo>=6.0.1',
    'cloudpickle>=3.0.0',
    'pyarrow>=17.0.0',
    'numpy>=1.26.4,<2',
    'pandas>=2.2.2',
]
classifiers = [
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "pytest-cov>=2.12.1",
]
docs = [
    "autodoc>=0.5.0",
    "nbsphinx>=0.8.6",
    "sphinx>=7.2.6",
    "sphinx-book-theme>=1.1.3",
]
deploy = [
    "setuptools>=57.0.0",
    "build>=0.5.1",
    "twine>=4.0.1",
]

[project.urls]
Repository = "https://github.com/IMMM-SFA/go"
Documentation = "https://immm-sfa.github.io/go"

[tool.hatch.build]
packages = ["go"]  # set importable package name to "go"
include = ["go"]
